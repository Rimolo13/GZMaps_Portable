<!doctype html>
<html lang="de">
  <head>
    <title>GZMaps - Gesamte Karte</title>
    <link rel="icon" href="./src/res/icon/favicon.svg">
    <link rel="canonical" href="https://rimolo13.github.io/GZMaps-Portable/" />
    <link rel="stylesheet" href="./src/css/app.css" >
    <link rel="stylesheet" href="./src/css/main.css" >
    <script type="module" src="./src/js/app.js" ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eine Karte von einer Firma." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GZMaps" />
    <meta property="og:description" content="Eine Karte von einer Firma." />
    <meta property="og:image" content="https://rimolo13.github.io/GZMaps_Portable/src/favicon.png" />
    <meta property="og:url" content="https://rimolo13.github.io/GZMaps_Portable/" />
    <meta property="og:site_name" content="GZMaps" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <ul class="bar_list">
          <li class="headline logo">GZMaps</li>
          <li class="headline" id="headline_map_status">Gesamte Karte</li>
          <li><button class="login" id="login"></button></li>
        </ul>
      </header>
      <main class="content normal_text">
        <aside class="content_container">
          <menu class="button_container">
            <li><button class="button not_displayed">Zurück</button></li>
            <li><button class="button not_displayed">Bearbeiten</button></li>
            <li><button class="button not_displayed">Speichern</button></li>
          </menu>
          <search class="search_container">
              <input type="text" placeholder="Suche hier" id="search_bar">
              <ul id="search_result_container"></ul>
          </search>
          <menu class="floor_view_container">
            <li><button class="floor_view" id="floor_view_u">U</button></li>
            <li><button class="floor_view" id="floor_view_e">E</button></li>
            <li><button class="floor_view" id="floor_view_1">1</button></li>
            <li><button class="floor_view" id="floor_view_2">2</button></li>
            <li><button class="floor_view" id="floor_view_3">3</button></li>
            <li><button class="floor_view" id="floor_view_4">4</button></li>
          </menu>
        </aside>
        <main class="map">
          <div id="full_map">
            <button class="house" id="house_1">1</button>
            <button class="house" id="house_2">2</button>
            <button class="house" id="house_3">3</button>
            <button class="house" id="house_4">4</button>
            <button class="house" id="house_5">5</button>
            <button class="house" id="house_6">6</button>
            <button class="house" id="house_8">8</button>
            <button class="house" id="house_11">11</button>
            <span class="corridor" id="corridor_1"></span>
            <span class="corridor" id="corridor_2"></span>
            <span class="corridor" id="corridor_3"></span>
          </div>
        </main>
        <aside class="content_container">
          <ul></ul>
        </aside>
      </main>
      <footer class="bar">
        <ul class="bar_list">
          <li>
            <input type="color" id="color_setting">
          </li>
          <li>
            <ul class="normal_text" id="copyright">
              <li class="headline" id="copyright_date">©2026 </li>
              <li class="headline">Rimolo13 & Mocbuilder</li>
            </ul>
          </li>
          <li></li>
        </ul>
      </footer>
    </div>
  </body>
</html>
