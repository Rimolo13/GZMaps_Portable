<!doctype html>
<html lang="de">
  <head>
    <title>GZMaps - Gesamte Karte</title>
    <link rel="icon" href="./src/res/icon/favicon.svg">
    <link rel="canonical" href="https://rimolo13.github.io/GZMaps-Portable/" />
    <link rel="stylesheet" href="./src/css/app.css" >
    <link rel="stylesheet" href="./src/css/main.css" >
    <script type="module" src="./src/js/app.js" ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eine Karte von einer Firma." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GZMaps" />
    <meta property="og:description" content="Eine Karte von einer Firma." />
    <meta property="og:image" content="https://rimolo13.github.io/GZMaps_Portable/src/favicon.png" />
    <meta property="og:url" content="https://rimolo13.github.io/GZMaps_Portable/" />
    <meta property="og:site_name" content="GZMaps" />
  </head>
  <body>
    <div id="App">
      <header class="bar">
        <ul class="barList">
          <li class="headline logo">GZMaps</li>
          <li class="headline" id="HeadlineMapStatus">Gesamte Karte</li>
          <li><button id="Login"></button></li>
        </ul>
      </header>
      <main class="content normalText">
        <aside class="contentContainer">
          <menu class="buttonContainer">
            <li><button class="button notDisplayed">Zurück</button></li>
            <li><button class="button notDisplayed">Bearbeiten</button></li>
            <li><button class="button notDisplayed">Speichern</button></li>
          </menu>
          <search class="searchContainer">
              <input type="text" placeholder="Suche hier" id="SearchBar">
              <ul id="SearchResultContainer"></ul>
          </search>
          <menu class="floorViewContainer">
            <li><button class="floorView" id="FloorView_u">U</button></li>
            <li><button class="floorView" id="FloorView_e">E</button></li>
            <li><button class="floorView" id="FloorView_1">1</button></li>
            <li><button class="floorView" id="FloorView_2">2</button></li>
            <li><button class="floorView" id="FloorView_3">3</button></li>
            <li><button class="floorView" id="FloorView_4">4</button></li>
          </menu>
        </aside>
        <main class="map">
          <div id="FullMap">
            <button class="house" id="house_1">1</button>
            <button class="house" id="house_2">2</button>
            <button class="house" id="house_3">3</button>
            <button class="house" id="house_4">4</button>
            <button class="house" id="house_5">5</button>
            <button class="house" id="house_6">6</button>
            <button class="house" id="house_8">8</button>
            <button class="house" id="house_11">11</button>
            <span class="corridor" id="corridor_1"></span>
            <span class="corridor" id="corridor_2"></span>
            <span class="corridor" id="corridor_3"></span>
          </div>
        </main>
        <aside class="contentContainer">
          <ul></ul>
        </aside>
      </main>
      <footer class="bar">
        <ul class="barList">
          <li>
            <input type="color" id="ColorSetting">
          </li>
          <li>
            <ul class="normalText" id="Copyright">
              <li class="headline" id="CopyrightDate">©2026 </li>
              <li class="headline">Rimolo13 & Mocbuilder</li>
            </ul>
          </li>
          <li></li>
        </ul>
      </footer>
    </div>
  </body>
</html>
