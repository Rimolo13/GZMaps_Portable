<!doctype html>
<html lang="de">
  <head>
    <title>GZMaps - Gesamte Karte</title>
    <link rel="icon" href="./src/res/icon/favicon.svg">
    <link rel="canonical" href="https://rimolo13.github.io/GZMaps-Portable/" />
    <link rel="stylesheet" href="./src/css/setting.css" >
    <link rel="stylesheet" href="./src/css/app.css" >
    <link rel="stylesheet" href="./src/css/main.css" >
    <script type="module" src="./src/js/setting.js" ></script>
    <script type="module" src="./src/js/app.js" ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eine Karte von einer Firma." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GZMaps" />
    <meta property="og:description" content="Eine Karte von einer Firma." />
    <meta property="og:image" content="https://rimolo13.github.io/GZMaps-Portable/src/favicon.png" />
    <meta property="og:url" content="https://rimolo13.github.io/GZMaps-Portable/" />
    <meta property="og:site_name" content="GZMaps" />
  </head>
  <body>
    <div id="setting"></div>
    <div id="app">
      <header class="bar">
        <p class="headline logo">GZMaps</p>
        <p class="headline" id="headline_map_status">Gesamte Karte</p>
      </header>
      <main class="content normal_text">
        <div class="content_container">
          <div class="button_container">
            <p class="button">Zurück</p>
            <p class="button">Bearbeiten</p>
            <p class="button">Speichern</p>
          </div>
          <div class="search_container">
            <input type="text" placeholder="Wonach suchst du?">
            <div class="search_result_container"></div>
          </div>
          <div class="floor_view_container">
            <p class="floor_view" id="floor_view_u">U</p>
            <p class="floor_view" id="floor_view_e">E</p>
            <p class="floor_view" id="floor_view_1">1</p>
            <p class="floor_view" id="floor_view_2">2</p>
            <p class="floor_view" id="floor_view_3">3</p>
            <p class="floor_view" id="floor_view_4">4</p>
          </div>
        </div>
        <div class="map">
          <div id="full_map">
            <p class="house" id="house_1">1</p>
            <p class="house" id="house_2">2</p>
            <p class="house" id="house_3">3</p>
            <p class="house" id="house_4">4</p>
            <p class="house" id="house_5">5</p>
            <p class="house" id="house_6">6</p>
            <p class="house" id="house_8">8</p>
            <p class="house" id="house_11">11</p>
            <p class="corridor" id="corridor_1"></p>
            <p class="corridor" id="corridor_2"></p>
            <p class="corridor" id="corridor_3"></p>
          </div>
        </div>
        <div class="content_container"></div>
      </main>
      <footer class="bar">
          <p id="color_setting"></p>
          <div id="copyright">
            <p class="headline" id="copyright_date">©2026 </p>
            <p class="headline">Rimolo13 & Mocbuilder</p>
          </div>
      </footer>
    </div>
  </body>
</html>
